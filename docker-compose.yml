# ==============================================================================
# DOCKER COMPOSE: HỆ THỐNG LAPTOP99 (FULL-STACK E-COMMERCE SYSTEM)
# Đồ án: Báo cáo phát triển hệ thống - Khoa Công nghệ Thông tin - Đại học CMC
# ==============================================================================
# Hướng dẫn khởi động toàn bộ hệ thống bằng 1 câu lệnh duy nhất:
#     docker compose up -d --build
#
# Các cổng truy cập sau khi khởi động:
#   1. Storefront Khách hàng: http://localhost:3000 hoặc http://localhost:8080
#   2. Frontend Quản trị Admin: http://localhost:5173
#   3. Backend REST API:        http://localhost:4000/api
#   4. Database MySQL:          localhost:3306 (user: root, pass: root, db: laptop_shop)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE SERVICE (MySQL 8.0 tự động nạp sẵn dữ liệu từ laptop_shop.sql)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: laptop99-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laptop_shop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./laptop_shop.sql:/docker-entrypoint-initdb.d/01-laptop_shop.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - laptop99-net

  # ----------------------------------------------------------------------------
  # 2. BACKEND API SERVICE (Node.js Express + MySQL)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./laptop-shop-admin-backend/laptop-shop-admin-backend
      dockerfile: Dockerfile
    container_name: laptop99-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: laptop_shop
      DB_SSL: "false"
      JWT_SECRET: "laptop99_cmc_secret_key_2026_super_secure"
      JWT_EXPIRES_IN: "8h"
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://localhost:8080"
      UPLOAD_DIR: "uploads"
    ports:
      - "4000:4000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laptop99-net

  # ----------------------------------------------------------------------------
  # 3. FRONTEND ADMIN DASHBOARD (React + Vite + Nginx)
  # ----------------------------------------------------------------------------
  admin:
    build:
      context: ./laptop-shop-admin
      dockerfile: Dockerfile
    container_name: laptop99-admin
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - laptop99-net

  # ----------------------------------------------------------------------------
  # 4. CUSTOMER STOREFRONT (HTML5 / MVC / CSS3 / Nginx)
  # ----------------------------------------------------------------------------
  storefront:
    image: nginx:alpine
    container_name: laptop99-storefront
    restart: unless-stopped
    ports:
      - "3000:80"
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./storefront:/usr/share/nginx/html/storefront:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
      - ./nginx-storefront.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - laptop99-net

volumes:
  mysql_data:
    name: laptop99_mysql_data

networks:
  laptop99-net:
    name: laptop99_network
