<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <defs>
    <linearGradient id="l99BadgeGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="l99ScreenGrad" x1="10" y1="10" x2="34" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- Rounded 3D Badge -->
  <rect x="2" y="3" width="42" height="42" rx="11" fill="url(#l99BadgeGrad)"/>
  <rect x="3" y="4" width="40" height="40" rx="10" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>

  <!-- Laptop Lid & Bezel -->
  <rect x="10.5" y="10.5" width="25" height="16.5" rx="2.5" fill="#0F172A" stroke="#BFDBFE" stroke-width="1.3"/>
  <rect x="12.5" y="12.5" width="21" height="12.5" rx="1.2" fill="url(#l99ScreenGrad)"/>

  <!-- Tech Emblem inside Screen -->
  <path d="M19.5 16.2L16.8 18.7L19.5 21.2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26.5 16.2L29.2 18.7L26.5 21.2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 15.5L22 22" stroke="#93C5FD" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Laptop Base Deck -->
  <path d="M7.5 29.5C7.5 28.67 8.17 28 9 28H37C37.83 28 38.5 28.67 38.5 29.5L40.2 33.5H5.8L7.5 29.5Z" fill="#0F172A"/>
  <rect x="20" y="30.2" width="6" height="1.6" rx="0.8" fill="#60A5FA"/>

  <!-- Brand Wordmark -->
  <text x="52" y="25" font-family="'Inter', 'Be Vietnam Pro', system-ui, sans-serif" font-size="19" font-weight="900" fill="#111827" letter-spacing="-0.4">
    LAPTOP<tspan fill="#2563EB">99</tspan>
  </text>
  <text x="52" y="38" font-family="'Inter', 'Be Vietnam Pro', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="1.6">
    OFFICIAL STORE
  </text>
  <circle cx="152" cy="35" r="2.6" fill="#16A34A"/>
</svg>
