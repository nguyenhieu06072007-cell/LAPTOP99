<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Laptop99 | Hệ thống bán lẻ Laptop chính hãng</title>
  <link rel="icon" type="image/png" href="storefront/assets/logo-laptop99.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Storefront Design System & Styles (MVC View Styles) -->
  <link rel="stylesheet" href="storefront/css/styles.css?v=20261112_v1">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('laptop99_theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}

      // Bộ giám sát Watchdog độc lập ngay trong <head>
      // Giải cứu tự động nếu trình duyệt bị nghẽn mạng hoặc Render Backend đang Cold Start
      setTimeout(function() {
        var appEl = document.getElementById('app');
        var isStuck = !window.__APP_MOUNTED__ || (appEl && (appEl.innerText.includes('Đang tải LAPTOP99') || appEl.querySelector('.spin') || !document.getElementById('nav')));
        if (isStuck && appEl) {
          console.warn('[Watchdog] Phát hiện trang đang chờ mạng, kích hoạt bộ giải cứu...');
          if (typeof window.__RESCUE_MOUNT__ === 'function') {
            window.__RESCUE_MOUNT__();
          } else {
            appEl.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1329;color:#fff;padding:24px;text-align:center;font-family:system-ui,-apple-system,sans-serif">'
              + '<div style="width:52px;height:52px;border-radius:50%;background:rgba(220,38,38,0.2);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;border:1px solid #dc2626">⚡</div>'
              + '<h2 style="font-size:20px;margin-bottom:8px;font-weight:700">Máy chủ Backend đang khởi động lại (Cold Start)</h2>'
              + '<p style="color:#94a3b8;font-size:14px;max-width:480px;margin-bottom:24px;line-height:1.6">Server đám mây miễn phí Render đang tự đánh thức. Bạn có thể bấm vào xem trang ngay bằng dữ liệu có sẵn hoặc làm mới bộ nhớ:</p>'
              + '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">'
              + '<button onclick="if(window.__RESCUE_MOUNT__)window.__RESCUE_MOUNT__();else location.reload(true);" style="background:#dc2626;color:#fff;border:none;padding:12px 26px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 16px rgba(220,38,38,0.4)">🚀 VÀO XEM LAPTOP99 NGAY</button>'
              + '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}location.reload(true);" style="background:rgba(255,255,255,0.1);color:#e2e8f0;border:1px solid rgba(255,255,255,0.2);padding:12px 20px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer">🔄 Xóa Cache &amp; Tải lại</button>'
              + '</div>'
              + '</div>';
          }
        }
      }, 3500);
    })();
  </script>
</head>
<body>
      <div id="app">
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1329;color:#94a3b8;font-family:system-ui,-apple-system,sans-serif">
      <div style="width:42px;height:42px;border:3px solid rgba(220,38,38,0.2);border-top-color:#dc2626;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px"></div>
      <div style="font-size:14px;color:#cbd5e1;font-weight:500">Đang tải LAPTOP99...</div>
    </div>
  </div>
  <div id="modal" role="dialog" aria-modal="true"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="storefront/js/controllers/catalog.controller.js?v=20261112_v1"></script>
  <script src="storefront/js/controllers/cart.controller.js?v=20261112_v1"></script>
  <script src="storefront/js/controllers/checkout.controller.js?v=20261112_v1"></script>
  <script src="storefront/js/controllers/auth.controller.js?v=20261112_v1"></script>
  <script src="storefront/js/controllers/services.controller.js?v=20261112_v1"></script>
  <script src="storefront/js/controllers/chatbot.controller.js?v=20261112_v1"></script>
  <script src="storefront/js/controllers/app.controller.js?v=20261112_v1"></script>
</body>
</html>
