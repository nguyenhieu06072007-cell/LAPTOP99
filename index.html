<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Laptop99 | Hệ thống bán lẻ Laptop chính hãng</title>
  <link rel="icon" type="image/png" href="storefront/assets/logo-laptop99.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Storefront Design System & Styles (MVC View Styles) -->
  <link rel="stylesheet" href="storefront/css/styles.css?v=20261109_v4">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('laptop99_theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
</head>
<body>
      <div id="app">
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1329;color:#94a3b8;font-family:system-ui,-apple-system,sans-serif">
      <div style="width:42px;height:42px;border:3px solid rgba(220,38,38,0.2);border-top-color:#dc2626;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px"></div>
      <div style="font-size:14px;color:#cbd5e1;font-weight:500">Đang tải LAPTOP99...</div>
    </div>
  </div>
  <div id="modal" role="dialog" aria-modal="true"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- ==================================================================== -->
  <!-- STOREFRONT MVC ARCHITECTURE MODULES                                  -->
  <!-- ==================================================================== -->

  <!-- 1. Utils & Router Layer -->
  <script src="storefront/js/utils/helpers.js?v=20261109_v4"></script>
  <script src="storefront/js/utils/formatters.js?v=20261109_v4"></script>
  <script src="storefront/js/app/router.js?v=20261109_v4"></script>

  <!-- 2. Service Layer: REST API Client & Domain Services -->
  <script src="storefront/js/services/api.service.js?v=20261109_v4"></script>
  <script src="storefront/js/services/product.service.js?v=20261109_v4"></script>
  <script src="storefront/js/services/order.service.js?v=20261109_v4"></script>
  <script src="storefront/js/services/auth.service.js?v=20261109_v4"></script>
  <script src="storefront/js/services/promotions.service.js?v=20261109_v4"></script>

  <!-- 3. Model Layer: Domain Entities, Business Calculations & State Store -->
  <script src="storefront/js/models/product.model.js?v=20261109_v4"></script>
  <script src="storefront/js/models/cart.model.js?v=20261109_v4"></script>
  <script src="storefront/js/models/store.model.js?v=20261109_v4"></script>

  <!-- 4. View Components & Layout Views -->
  <script src="storefront/js/views/components/common.view.js?v=20261109_v4"></script>
  <script src="storefront/js/views/components/product-card.view.js?v=20261109_v4"></script>
  <script src="storefront/js/views/components/chatbot.view.js?v=20261109_v4"></script>
  <script src="storefront/js/views/layouts/layout.view.js?v=20261109_v4"></script>

  <!-- 5. Page Views -->
  <script src="storefront/js/views/pages/home.view.js?v=20261109_v4"></script>
  <script src="storefront/js/views/pages/catalog.view.js?v=20261109_v4"></script>
  <script src="storefront/js/views/pages/checkout.view.js?v=20261109_v4"></script>
  <script src="storefront/js/views/pages/services.view.js?v=20261109_v4"></script>

  <!-- 6. Controller Layer: Domain Controllers & Central App Dispatcher -->
  <script src="storefront/js/controllers/home.controller.js?v=20261109_v4"></script>
  <script src="storefront/js/controllers/catalog.controller.js?v=20261109_v4"></script>
  <script src="storefront/js/controllers/cart.controller.js?v=20261109_v4"></script>
  <script src="storefront/js/controllers/checkout.controller.js?v=20261109_v4"></script>
  <script src="storefront/js/controllers/auth.controller.js?v=20261109_v4"></script>
  <script src="storefront/js/controllers/services.controller.js?v=20261109_v4"></script>
  <script src="storefront/js/controllers/chatbot.controller.js?v=20261109_v4"></script>
  <script src="storefront/js/controllers/app.controller.js?v=20261109_v4"></script>

  <script>
    // Watchdog an toàn: nếu sau 4 giây vẫn chưa mount xong, hiện nút tự động dọn cache & tải lại
    setTimeout(function() {
      if (!window.__APP_MOUNTED__) {
        var el = document.getElementById('app');
        if (el) {
          el.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1329;color:#fff;padding:24px;text-align:center;font-family:system-ui,-apple-system,sans-serif">'
            + '<div style="font-size:40px;margin-bottom:12px">🔄</div>'
            + '<h2 style="font-size:18px;margin-bottom:8px;font-weight:700">Trình duyệt đang lưu bản cache cũ</h2>'
            + '<p style="color:#94a3b8;font-size:13px;max-width:420px;margin-bottom:20px;line-height:1.5">Trình duyệt của bạn đang đọc file mã nguồn cũ từ bộ nhớ tạm (Disk Cache). Hãy bấm nút dưới đây để làm mới ngay:</p>'
            + '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}location.reload(true);" style="background:#dc2626;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 16px rgba(220,38,38,0.4)">⚡ XÓA BỘ NHỚ ĐỆM & TẢI LẠI TRANG</button>'
            + '</div>';
        }
      }
    }, 4000);
  </script>
</body>
</html>
