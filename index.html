    // Kiểm tra thông minh: Chỉ cảnh báo khi người dùng vô tình bấm đúp mở file:// trực tiếp trong file zip Windows Temp
    (function() {
      if (typeof window !== 'undefined' && window.location.protocol === 'file:' && (window.location.href.indexOf('Temp') !== -1 || window.location.href.indexOf('.zip') !== -1)) {
        setTimeout(function() {
          var app = document.getElementById('app');
          if (app && !window.__APP_MOUNTED__) {
            app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1329;padding:24px;font-family:system-ui,-apple-system,sans-serif;color:#f8fafc"><div style="max-width:540px;width:100%;background:#131f38;border:1px solid #233354;border-radius:18px;padding:36px;box-shadow:0 24px 48px rgba(0,0,0,0.6);text-align:center"><div style="font-size:36px;margin-bottom:14px">⚠️</div><h2 style="font-size:18px;font-weight:700;color:#f87171;margin-bottom:12px">Vui lòng Giải Nén (Extract) file ZIP trước khi mở!</h2><p style="font-size:14px;line-height:1.6;color:#94a3b8;margin-bottom:20px">Bạn đang bấm mở trực tiếp từ bên trong file nén ZIP nên trình duyệt không thể tải được các thư mục mã nguồn và hình ảnh đi kèm. Hãy nhấn chuột phải vào file ZIP &rarr; chọn <b>Extract All (Giải nén tất cả)</b> rồi mở lại file <code>index.html</code> nhé.</p></div></div>';
          }
        }, 150);
      }
    })();
