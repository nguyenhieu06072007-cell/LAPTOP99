name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laptop-shop-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laptop-shop-admin-backend/laptop-shop-admin-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node --test test/admin-operations.test.js

  admin-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: laptop99-test-db
          MYSQL_DATABASE: laptop99_ci
          MYSQL_USER: laptop99_ci
          MYSQL_PASSWORD: laptop99-test-db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost --silent" --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: laptop-shop-admin-backend/laptop-shop-admin-backend
    env:
      CI_ADMIN_MYSQL: '1'
      DB_HOST: 127.0.0.1
      DB_USER: laptop99_ci
      DB_PASSWORD: laptop99-test-db
      DB_NAME: laptop99_ci
      DB_SSL: 'false'
      NODE_ENV: test
      JWT_SECRET: laptop99-ci-test-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node --test test/admin-mysql.test.js
