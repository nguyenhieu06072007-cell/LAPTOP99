<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="laptopGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="8" y1="8" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="48" y1="12" x2="160" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Laptop Icon Badge -->
  <rect x="2" y="4" width="40" height="40" rx="10" fill="url(#laptopGrad)" filter="drop-shadow(0 4px 6px rgba(37,99,235,0.3))"/>
  
  <!-- Laptop Screen Lid -->
  <rect x="11" y="11" width="22" height="15" rx="2" fill="#0f172a" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="13" y="13" width="18" height="11" rx="1" fill="url(#screenGrad)"/>
  
  <!-- Code symbol / lightning on screen -->
  <path d="M19 16.5L16.5 18.5L19 20.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M25 16.5L27.5 18.5L25 20.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Laptop Base / Keyboard deck -->
  <path d="M8 28.5C8 27.67 8.67 27 9.5 27H34.5C35.33 27 36 27.67 36 28.5L37.5 32H6.5L8 28.5Z" fill="#1e293b"/>
  <!-- Trackpad indent -->
  <rect x="19.5" y="29.5" width="5" height="1.5" rx="0.5" fill="#64748b"/>

  <!-- Brand Typography -->
  <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="url(#textGrad)" letter-spacing="0.5">
    LAPTOP<tspan fill="#38bdf8">SHOP</tspan>
  </text>
  
  <text x="48" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1.5">
    ADMIN CENTER
  </text>
  
  <!-- Active Green Indicator Dot -->
  <circle cx="140" cy="34" r="2.5" fill="#10b981"/>
</svg>
